steps:
  # Step 1: Build Docker image with both tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api:$_SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # Step 2: Push all tags at once
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api'

  # Step 3: Deploy to Cloud Run - secrets pulled from Secret Manager at runtime
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'exam-portal-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api:$_SHORT_SHA'
      - '--platform=managed'
      - '--region=$_REGION'
      - '--allow-unauthenticated'
      - '--set-secrets=TURSO_DATABASE_URL=turso-database-url:latest,TURSO_AUTH_TOKEN=turso-auth-token:latest'
      - '--update-env-vars=RAZORPAY_KEY_ID=rzp_live_TGayKgYF6kfKCt,RAZORPAY_KEY_SECRET=Q1T8RypFzImMstk15MlUbCcF,RAZORPAY_WEBHOOK_SECRET=Q1T8RypFzImMstk15MlUbCcF'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api:$_SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-api:latest'

substitutions:
  _REGION: 'asia-south1'
  _SHORT_SHA: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s