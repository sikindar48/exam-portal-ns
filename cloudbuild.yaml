steps:
  # Step 1: Build Docker image for the backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:$SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend' # Use the backend directory directly as the build context

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:latest'

  # Step 3: Deploy using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'exam-portal-ns'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:$SHORT_SHA'
      - '--platform=managed'
      - '--region=$_REGION'
      - '--allow-unauthenticated'
      - '--set-env-vars=TURSO_DATABASE_URL=$$TURSO_DATABASE_URL,TURSO_AUTH_TOKEN=$$TURSO_AUTH_TOKEN,FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID,FIREBASE_PRIVATE_KEY=$$FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL=$$FIREBASE_CLIENT_EMAIL'
    secretEnv:
      - 'TURSO_DATABASE_URL'
      - 'TURSO_AUTH_TOKEN'
      - 'FIREBASE_PROJECT_ID'
      - 'FIREBASE_PRIVATE_KEY'
      - 'FIREBASE_CLIENT_EMAIL'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:$SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-portal-ns/exam-portal-ns:latest'

substitutions:
  _REGION: 'asia-south2'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/turso-connection-url/versions/latest
      env: 'TURSO_DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/turso-auth-token/versions/latest
      env: 'TURSO_AUTH_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/firebase-project-id/versions/latest
      env: 'FIREBASE_PROJECT_ID'
    - versionName: projects/$PROJECT_ID/secrets/firebase-private-key/versions/latest
      env: 'FIREBASE_PRIVATE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/firebase-client-email/versions/latest
      env: 'FIREBASE_CLIENT_EMAIL'

timeout: 3600s
