steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/exam-portal-ns:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/exam-portal-ns:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/exam-portal-ns:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/exam-portal-ns:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/exam-portal-ns:$SHORT_SHA'
      - '--location=asia-south2'

  # Step 4: Deploy using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'exam-portal-ns'
      - '--image=gcr.io/$PROJECT_ID/exam-portal-ns:$SHORT_SHA'
      - '--platform=managed'
      - '--region=asia-south2'
      - '--allow-unauthenticated'
      - '--set-env-vars=TURSO_CONNECTION_URL=$$TURSO_CONNECTION_URL,TURSO_AUTH_TOKEN=$$TURSO_AUTH_TOKEN,FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID,FIREBASE_PRIVATE_KEY=$$FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL=$$FIREBASE_CLIENT_EMAIL'
    secretEnv:
      - 'TURSO_CONNECTION_URL'
      - 'TURSO_AUTH_TOKEN'
      - 'FIREBASE_PROJECT_ID'
      - 'FIREBASE_PRIVATE_KEY'
      - 'FIREBASE_CLIENT_EMAIL'

images:
  - 'gcr.io/$PROJECT_ID/exam-portal-ns:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/exam-portal-ns:latest'

substitutions:
  _REGION: 'asia-south2'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

secrets:
  - versionName: projects/$PROJECT_ID/secrets/turso-connection-url/versions/latest
    env: 'TURSO_CONNECTION_URL'
  - versionName: projects/$PROJECT_ID/secrets/turso-auth-token/versions/latest
    env: 'TURSO_AUTH_TOKEN'
  - versionName: projects/$PROJECT_ID/secrets/firebase-project-id/versions/latest
    env: 'FIREBASE_PROJECT_ID'
  - versionName: projects/$PROJECT_ID/secrets/firebase-private-key/versions/latest
    env: 'FIREBASE_PRIVATE_KEY'
  - versionName: projects/$PROJECT_ID/secrets/firebase-client-email/versions/latest
    env: 'FIREBASE_CLIENT_EMAIL'

timeout: 3600s
