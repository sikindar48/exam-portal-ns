name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ns-exam-portal
  REGION: asia-south2
  SERVICE: exam-portal-ns
  REGISTRY_URL: gcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as authentication provider
        run: |
          gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY_URL/$PROJECT_ID/$SERVICE:$GITHUB_SHA \
            -t $REGISTRY_URL/$PROJECT_ID/$SERVICE:latest \
            -f backend/Dockerfile \
            .

      - name: Push image to Google Container Registry
        run: |
          docker push $REGISTRY_URL/$PROJECT_ID/$SERVICE:$GITHUB_SHA
          docker push $REGISTRY_URL/$PROJECT_ID/$SERVICE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image=$REGISTRY_URL/$PROJECT_ID/$SERVICE:$GITHUB_SHA \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --project=$PROJECT_ID \
            --set-env-vars="TURSO_CONNECTION_URL=${{ secrets.TURSO_CONNECTION_URL }},TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }},FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }},FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }},FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
            --service-account=$SERVICE@$PROJECT_ID.iam.gserviceaccount.com

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE \
            --region=$REGION \
            --project=$PROJECT_ID \
            --format='value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          curl -s $SERVICE_URL/health | jq .

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Service URL: $(gcloud run services describe $SERVICE --region=$REGION --project=$PROJECT_ID --format='value(status.url)')"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
